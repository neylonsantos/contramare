{% assign post_url = page.url | prepend: site.url | url_encode %}
{% assign post_title = page.title | url_encode %}

<div class="share-buttons mt-4 pt-3" aria-label="Compartilhar artigo">
  <span class="share-buttons__label">Compartilhar:</span>

  <a href="https://x.com/intent/tweet?text={{ post_title }}&url={{ post_url }}"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Compartilhar no X"
     class="share-btn share-btn--twitter">
    <i class="bi bi-twitter-x"></i>
  </a>

  <a href="https://wa.me/?text={{ post_title }}%20{{ post_url }}"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Compartilhar no WhatsApp"
     class="share-btn share-btn--whatsapp">
    <i class="bi bi-whatsapp"></i>
  </a>

  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ post_url }}"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Compartilhar no LinkedIn"
     class="share-btn share-btn--linkedin">
    <i class="bi bi-linkedin"></i>
  </a>

  <button onclick="navigator.clipboard.writeText('{{ page.url | prepend: site.url }}')"
          aria-label="Copiar link do artigo"
          class="share-btn share-btn--copy"
          title="Copiar link">
    <i class="bi bi-link-45deg"></i>
  </button>
</div>
